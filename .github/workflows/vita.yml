name: Build Vita
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: build
          key: build-${{ github.run_id }}
          restore-keys: build-
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake -DCMAKE_BUILD_TYPE=ReleaseGeneric -DCMAKE_CXX_FLAGS="-DJPH_PLATFORM_LINUX -include $GITHUB_WORKSPACE/vita_compat/vita_shim.h -I$GITHUB_WORKSPACE/vita_compat" -DCMAKE_CXX_STANDARD_LIBRARIES="-lvitaGL -lmathneon -lSceShaccCg_stub -lSceKernelDmacMgr_stub -lSceGxm_stub -lSceDisplay_stub -lSceSysmodule_stub -lSceCtrl_stub -lSceTouch_stub -lSceMotion_stub -lSceAppMgr_stub -lSceAudio_stub -lSceAudioIn_stub -lSceCommonDialog_stub -lSceIme_stub -lSceHid_stub"
      - name: Build
        run: cmake --build build -j4 -- -k
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build
          key: build-${{ github.run_id }}
